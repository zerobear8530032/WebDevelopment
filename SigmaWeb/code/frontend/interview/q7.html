<!-- // The Local Storage Manager: You are working on a note-taking app, and you want to implement a function named saveNoteToLocalStorage that takes a note object and saves it to the browser's local storage. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7</title>
</head>
<body>
    <div class="note">

    </div>
        <button>ADD TO  LOCAL STORAGE </button>
    <script>
        function saveToLocalStorage(note){
            localStorage.setItem("note",note);
            alert("Your Note is Save To LocalStorage ");
            const localdiv= document.querySelector(".note");
            localdiv.innerHTML= localStorage.getItem("note");
        }
        if(localStorage.getItem("note")){
            const localdiv= document.querySelector(".note");
            localdiv.innerHTML= localStorage.getItem("note");
        }
        const button = document.querySelector("button");
        button.addEventListener("click",()=>{
            const note = prompt("Enter your Note");
            saveToLocalStorage(note);
        })
    </script>
</body>
</html>
